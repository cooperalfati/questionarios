<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perguntas e Respostas · Cooperativa Alfa</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<link rel="stylesheet" href="styles.css?v=20261126b">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <img src="logo-alfa.png" alt="Cooperativa Alfa" class="brand-logo" width="117" height="40">
        <span class="brand-sep" aria-hidden="true"></span>
        <h1>Perguntas e Respostas</h1>
      </div>
      <div class="quem" id="quem" hidden>
        <div><strong id="quem-nome"></strong><small id="quem-email"></small></div>
        <button class="btn sm" type="button" id="btn-sair">Sair</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Seções" id="nav" hidden>
      <a href="#questionarios" id="tab-questionarios" hidden>Questionários</a>
      <a href="#responder" id="tab-responder" hidden>Responder</a>
      <a href="#respostas" id="tab-respostas" hidden>Respostas</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <p class="notice" id="aviso" hidden></p>
  <section id="v-login" hidden>
    <div class="panel login">
      <img src="logo-alfa.png" alt="Cooperativa Alfa" class="login-logo" width="157" height="54">
      <h2>Área do administrador</h2>
      <p>Entre com a sua conta Google para criar questionários, enviar convites e ver as respostas. Quem recebeu um convite responde pelo link do e-mail, sem login.</p>
      <button class="g-btn" type="button" id="btn-entrar"><img src="google-g.png" alt="" class="g-icon" width="20" height="20">Entrar com Google</button>
      <p class="msg err" id="login-msg" role="status" aria-live="polite" style="margin:16px 0 0"></p>
    </div>
  </section>
  <section id="v-questionarios" hidden></section>
  <section id="v-editor" hidden></section>
  <section id="v-responder"><p class="muted" id="carregando">Carregando…</p></section>
  <section id="v-respostas" hidden></section>
  <section id="v-convidados" hidden></section>
</main>

<script type="module" src="app.js?v=20261126b"></script>
</body>
</html>
